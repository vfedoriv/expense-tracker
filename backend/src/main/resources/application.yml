app:
  auth:
    fake: ${APP_AUTH_FAKE:true}
  base-url: ${APP_BASE_URL:http://localhost:3000}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: expense-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expensetracker}
    username: ${DB_USERNAME:expensetracker}
    password: ${DB_PASSWORD:expensetracker}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.expensetracker: INFO

---
# OAuth2 configuration — only loaded when APP_AUTH_FAKE=false
spring:
  config:
    activate:
      on-property: "APP_AUTH_FAKE=false"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "${APP_BASE_URL:http://localhost:3000}/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            redirect-uri: "${APP_BASE_URL:http://localhost:3000}/login/oauth2/code/github"
